<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de la Madre</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        .container {
            perspective: 1000px;
        }

        .card {
            width: 400px;
            height: 550px;
            position: relative;
            transform-style: preserve-3d;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotateY(0deg); }
            50% { transform: translateY(-20px) rotateY(5deg); }
        }

        .card-front {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow: hidden;
        }

        .flowers {
            position: absolute;
            top: -50px;
            left: -50px;
            width: 200px;
            height: 200px;
            opacity: 0.3;
        }

        .flower {
            position: absolute;
            animation: spin 20s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .petal {
            width: 30px;
            height: 30px;
            background: #ff6b9d;
            border-radius: 50% 50% 0 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 0 0;
            opacity: 0.8;
        }

        .petal:nth-child(1) { transform: rotate(0deg) translateX(25px); }
        .petal:nth-child(2) { transform: rotate(72deg) translateX(25px); }
        .petal:nth-child(3) { transform: rotate(144deg) translateX(25px); }
        .petal:nth-child(4) { transform: rotate(216deg) translateX(25px); }
        .petal:nth-child(5) { transform: rotate(288deg) translateX(25px); }

        .heart {
            width: 80px;
            height: 80px;
            position: relative;
            margin-bottom: 30px;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            10%, 30% { transform: scale(1.1); }
            20%, 40% { transform: scale(1); }
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 40px;
            height: 65px;
            background: #ff1744;
            border-radius: 40px 40px 0 0;
        }

        .heart::before {
            left: 40px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        h1 {
            font-size: 42px;
            color: #c2185b;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: fadeInDown 1s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message {
            font-size: 20px;
            color: #4a0e2f;
            text-align: center;
            line-height: 1.6;
            font-style: italic;
            animation: fadeIn 2s ease-out 0.5s both;
            padding: 0 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: sparkleAnim 2s ease-in-out infinite;
        }

        @keyframes sparkleAnim {
            0%, 100% { 
                opacity: 0;
                transform: scale(0);
            }
            50% { 
                opacity: 1;
                transform: scale(1);
            }
        }

        .sparkle:nth-child(1) { top: 10%; left: 15%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 20%; right: 20%; animation-delay: 0.5s; }
        .sparkle:nth-child(3) { bottom: 30%; left: 10%; animation-delay: 1s; }
        .sparkle:nth-child(4) { bottom: 15%; right: 15%; animation-delay: 1.5s; }
        .sparkle:nth-child(5) { top: 50%; left: 5%; animation-delay: 0.7s; }
        .sparkle:nth-child(6) { top: 60%; right: 8%; animation-delay: 1.2s; }

        .decorative-corner {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 3px solid rgba(194, 24, 91, 0.3);
        }

        .corner-top-left {
            top: 15px;
            left: 15px;
            border-right: none;
            border-bottom: none;
            border-radius: 15px 0 0 0;
        }

        .corner-bottom-right {
            bottom: 15px;
            right: 15px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-front">
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                
                <div class="decorative-corner corner-top-left"></div>
                <div class="decorative-corner corner-bottom-right"></div>
                
                <div class="flowers">
                    <div class="flower">
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                    </div>
                </div>
                
                <div class="heart"></div>
                
                <h1>¡Feliz Día Mamá!</h1>
                
                <p class="message">
                    "Eres el abrazo que reconforta, la voz que guía y el amor que nunca se agota. Gracias por ser mi refugio y mi inspiración cada día."
                </p>
            </div>
        </div>
    </div>
</body>
</html>
